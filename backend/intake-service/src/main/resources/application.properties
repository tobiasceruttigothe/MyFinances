spring.application.name=intake-service

# Fallback minimo si Config Server no responde.
# En produccion, el Config Server (GitHub) tiene la config completa.
server.port=8086
# Circuit breaker desactivado a propósito: no usamos fallbacks y un 404 de user-service
# (teléfono no vinculado) es una respuesta de negocio, no una falla. Con el CB activo,
# Resilience4j envuelve el 404 como "No fallback available" y tapa el FeignException.NotFound
# que el servicio maneja como NOT_LINKED. El try/catch del servicio ya da resiliencia.
spring.cloud.openfeign.circuitbreaker.enabled=false

# --- Anthropic (Claude) — parsing de lenguaje natural ---
# La API key vive en una variable de entorno / Secret de K8s (NUNCA hardcodeada).
# Cuenta de API de Anthropic (console.anthropic.com), distinta de Claude Pro.
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Modelo de parsing. Haiku 4.5 es barato y suficiente para extracción.
# Cambiar a claude-sonnet-4-6 o claude-opus-4-8 si se quiere más calidad.
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}

# --- ElevenLabs (Scribe) — Speech-to-Text de los audios de WhatsApp ---
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.model=${ELEVENLABS_MODEL:scribe_v1}
elevenlabs.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}

# --- URLs de servicios downstream (override por K8s env) ---
services.user-service.url=${SERVICES_USER_SERVICE_URL:http://localhost:8084}
services.account-service.url=${SERVICES_ACCOUNT_SERVICE_URL:http://localhost:8081}

# TTL de una transacción pendiente de confirmación (segundos).
intake.pending-ttl-seconds=${INTAKE_PENDING_TTL_SECONDS:600}
