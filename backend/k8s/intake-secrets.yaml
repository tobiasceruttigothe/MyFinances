# Secret con la API key de Anthropic para el intake-service.
# ⚠️ Placeholder — reemplazá el valor antes de desplegar (no commitear la key real).
#   kubectl create secret generic intake-secrets \
#     --from-literal=anthropic-api-key='sk-ant-...' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: intake-secrets
type: Opaque
stringData:
  anthropic-api-key: "REEMPLAZAR_CON_API_KEY_DE_ANTHROPIC"
  elevenlabs-api-key: "REEMPLAZAR_CON_API_KEY_DE_ELEVENLABS"
