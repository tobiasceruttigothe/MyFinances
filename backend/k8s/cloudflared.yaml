# cloudflared — Named Tunnel hacia n8n. URL ESTABLE con dominio propio.
#
# El tunnel se crea/gestiona en Cloudflare Zero Trust (Networks → Tunnels).
# El "Public Hostname" (p.ej. wa.myfinances.qzz.io → http://n8n:5678) se
# configura EN EL DASHBOARD de Cloudflare, no acá: el pod solo necesita el
# token (Secret cloudflared-token) para conectarse y traer esa config remota.
# Cloudflare crea el registro DNS y el cert HTTPS automáticamente.
#
# El Callback de Meta pasa a https://wa.myfinances.qzz.io/webhook/whatsapp y
# DEJA DE CAMBIAR en cada reinicio (a diferencia del Quick Tunnel anterior).
#
# Para volver al Quick Tunnel dev: args [tunnel, --no-autoupdate, --url, http://n8n:5678]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
