apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intake-service
  template:
    metadata:
      labels:
        app: intake-service
    spec:
      containers:
        - name: intake-service
          image: intake-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"

            # Desactivar Eureka
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: SPRING_CLOUD_DISCOVERY_ENABLED
              value: "false"

            # Observabilidad
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"

            # Service URLs (downstream)
            - name: SERVICES_USER_SERVICE_URL
              value: "http://user-service:8084"
            - name: SERVICES_ACCOUNT_SERVICE_URL
              value: "http://account-service:8081"

            # Circuit breaker desactivado: el 404 de user-service (teléfono no vinculado)
            # es respuesta de negocio, no falla; el try/catch del servicio da la resiliencia.
            - name: SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED
              value: "false"

            # IA — Anthropic (Claude). La key sale del Secret intake-secrets.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: anthropic-api-key
            - name: ANTHROPIC_MODEL
              value: "claude-haiku-4-5"

            # STT — ElevenLabs (Scribe). La key sale del Secret intake-secrets.
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: elevenlabs-api-key
            - name: ELEVENLABS_MODEL
              value: "scribe_v1"
---
apiVersion: v1
kind: Service
metadata:
  name: intake-service
spec:
  selector:
    app: intake-service
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
