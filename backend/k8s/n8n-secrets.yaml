# Secret para n8n (adaptador de WhatsApp del intake-service).
# ⚠️ Placeholder — generá una clave real antes de desplegar (no commitear la real).
#   kubectl create secret generic n8n-secrets \
#     --from-literal=encryption-key="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# encryption-key: clave con la que n8n cifra las credenciales que guarda (ej. el token
# de Meta). Si se pierde o cambia, n8n no puede descifrar las credenciales existentes.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
type: Opaque
stringData:
  encryption-key: "REEMPLAZAR_CON_openssl_rand_hex_24"
