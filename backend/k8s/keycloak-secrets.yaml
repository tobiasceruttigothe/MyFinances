apiVersion: v1
kind: Secret
metadata:
  name: keycloak-external-secrets
type: Opaque
stringData:
  # ── Google OAuth 2.0 ──────────────────────────────────────────────────────
  # Create credentials at: https://console.cloud.google.com/apis/credentials
  # Authorized redirect URI to add: http://localhost:8082/realms/myfinances-realm/broker/google/endpoint
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

  # ── SMTP (example: Gmail App Password) ───────────────────────────────────
  # For Gmail: enable 2FA, then generate an App Password at myaccount.google.com/apppasswords
  # For Mailtrap (dev/testing): use credentials from mailtrap.io/inboxes
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@myfinances.com"
  SMTP_USER: "REPLACE_WITH_EMAIL"
  SMTP_PASSWORD: "REPLACE_WITH_APP_PASSWORD"
