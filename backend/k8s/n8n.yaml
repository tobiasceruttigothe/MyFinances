# n8n — adaptador de WhatsApp para el intake-service (Fase 3).
# Corre los workflows que (A) reciben mensajes de Meta y los mandan al intake-service,
# y (B) mandan el código de verificación por WhatsApp.
#
# Persistencia: PVC con SQLite (suficiente para dev/Minikube). En AWS se cambia el
# storageClassName por uno de EBS, o se migra a Postgres (DB_TYPE=postgresdb).
# Los workflows se versionan como JSON en backend/n8n/workflows/ y se importan por API.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # n8n corre como uid/gid 1000 (usuario "node"); fsGroup hace el PVC escribible.
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
          env:
            # Clave con la que n8n cifra las credenciales guardadas (Secret).
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            # URL pública: el Named Tunnel de cloudflared (URL fija). Meta usa
            # esta URL para entregar los webhooks.
            - name: WEBHOOK_URL
              value: "https://wa.myfinances.qzz.io/"
            # Permitir login por http (acceso vía port-forward en dev). En AWS con https: true.
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: GENERIC_TIMEZONE
              value: "America/Argentina/Cordoba"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            # Forzar IPv4 al resolver hosts externos (graph.facebook.com). Minikube
            # no tiene ruta IPv6 saliente; sin esto, Node a veces elige una IPv6 y el
            # "Meta Send Reply" falla con "DNS server returned an error".
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
            # Permitir leer $env dentro de nodos (IF del verify token + Code del
            # HMAC usan $env.META_*). n8n lo bloquea por defecto; acá el único que
            # edita workflows es el owner, así que es aceptable.
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            # Permitir require('crypto') en el Code node del HMAC (n8n bloquea
            # módulos builtin por defecto).
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: "crypto"
            # Secretos de Meta para el hardening del Workflow A (verify token + HMAC).
            # Se aplican fuera de git (ver k8s/n8n-meta-secrets.yaml). optional:true
            # para que el pod arranque aunque el Secret no exista todavía.
            - name: META_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-meta-secrets
                  key: META_VERIFY_TOKEN
                  optional: true
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-meta-secrets
                  key: META_APP_SECRET
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
