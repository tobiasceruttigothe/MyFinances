# cloudflared — token del Named Tunnel (Cloudflare Zero Trust).
# TEMPLATE versionado con placeholder. El token REAL se aplica fuera de git:
#   kubectl create secret generic cloudflared-token \
#     --from-literal=token='<TOKEN_DE_CLOUDFLARE>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# (o editá este archivo localmente sin commitear el valor real).
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
type: Opaque
stringData:
  token: "REEMPLAZAR_CON_TOKEN_DEL_NAMED_TUNNEL"
