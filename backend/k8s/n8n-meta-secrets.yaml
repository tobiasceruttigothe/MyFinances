# Secretos de Meta que el Workflow A consume vía env (HMAC + verify token).
# TEMPLATE versionado con placeholders. Los valores REALES se aplican fuera de
# git (igual que cloudflared-token):
#   kubectl create secret generic n8n-meta-secrets \
#     --from-literal=META_VERIFY_TOKEN='<token>' \
#     --from-literal=META_APP_SECRET='<app secret de Meta>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# - META_VERIFY_TOKEN: string que elegís vos; debe COINCIDIR con el "Verify
#   Token" del webhook en la consola de Meta. El nodo "Verify Token OK?" lo valida.
# - META_APP_SECRET: Meta → App → Configuración → Información básica → Secreto
#   de la app. El nodo "Verify Signature" valida con él el HMAC del webhook.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-meta-secrets
type: Opaque
stringData:
  META_VERIFY_TOKEN: "REEMPLAZAR_CON_VERIFY_TOKEN"
  META_APP_SECRET: "REEMPLAZAR_CON_APP_SECRET_DE_META"
